<!doctype html>

  <div class="shell">
    <aside id="nav" class="nav" aria-label="章節導覽">
      <div class="nav-head">
        <p class="nav-kicker">KiCad 10 · 繁體中文</p>

      <p>請複製下方文字，貼到 AI 助教對話。教學會依共用進度接續。</p>
      <textarea id="clipboard-text" rows="9" aria-label="接續教學訊息" readonly></textarea>
