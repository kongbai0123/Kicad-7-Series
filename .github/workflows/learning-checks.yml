name: Learning system checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Run isolated persistence and API tests
        run: python -m unittest discover -s learning -p "test_*.py" -v
      - name: Check frontend syntax
        run: |
          node --check learning/web/sections.js
          node --check learning/web/app.js
      - name: Validate tracked learning content and clean initialization
        run: python learning/validate_repository.py
